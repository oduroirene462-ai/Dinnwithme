<html>
<head>
    <title>Place Order - Dinnwithme</title>
</head>
<body style="background-color: rgb(255, 248, 231); font-family: Arial, sans-serif;">

    <h1 style="background-color: rgb(230, 126, 34); color: rgb(255, 255, 255); padding: 10px; border-radius: 5px;">Place Your Order</h1>

    <form style="background-color: rgb(255, 255, 255); padding: 20px; border-radius: 10px; width: 400px;">
        
        <label>Your Name:</label><br>
        <input type="text" placeholder="Enter your name" style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" placeholder="059..." style="width: 100%; padding: 8px; margin: 8px 0;"><br><br>

        <label>Select Food:</label><br>
        <select style="width: 100%; padding: 8px; margin: 8px 0;">
            <option>Fufu with goat meat lightsoup</option>
            <option>Fufu with chicken lightsoup</option>
            <option>Fufu with palmnut soup</option>
            <option>Banku with okro stew</option>
            <option>Banku with tilapia</option>
            <option>Rice dishes</option>
        </select><br><br>

        <label>Delivery Address:</label><br>
        <textarea placeholder="Enter your location" style="width: 100%; padding: 8px; margin: 8px 0;"></textarea><br><br>

        <button type="submit" style="
            background-color: rgb(230, 126, 34);
            color: rgb(255, 255, 255);
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        ">Submit Order</button>
    </form>

    <br>
    <a href="index.html">Back to Home</a>

</body>
</html>
